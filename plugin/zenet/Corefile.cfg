# Resolver mode: forward queries to an external backend over nng REQ/REP.
example.net:5353 {
    zenet {
        address tcp://localhost:40899
        timeout 2s
        max_concurrent 1000
        ttl 3600
    }
    log
    errors
}

# Registry mode: in-plugin service registry. Services register/heartbeat over
# nng REQ/REP on port 40900 and are resolvable under cloud.zeno.
cloud.zeno:5353 {
    zenet {
        registry tcp://0.0.0.0:40900
        registry_max_ttl 60s
        ttl 30
    }
    log
    errors
}

.:5353 {
    forward . 8.8.8.8
    log
    errors
}
